[project]
name = "mass-outreach"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit>=1.65,<2",
  "email-validator>=2.2,<3",
  "httpx>=0.28,<1",
  "markdown>=3.7,<4",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1", "pglast>=7,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["billing.py", "patch_streamlit_html.py", ".rocketride", ".claude", ".opencode"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
